<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Velarion Lumen" />
  <title>Velarion Lumen</title>

  <script>
    (function(){
      var path = location.pathname || "/";
      var match = path.match(/^(.*\/)users\/([^/]+)\/profile\.html$/i);

      if (!match) {
        document.documentElement.dataset.vl404 = "true";
        return;
      }

      var base = match[1] || "/";
      var id = match[2] || "";
      try { id = decodeURIComponent(id); } catch (e) {}

      // Há apenas UMA página de perfil real: /users/profile.html.
      // A rota bonita /users/{ID}/profile.html nunca monta uma cópia própria
      // nem carrega versões separadas de CSS/JS. Ela apenas encaminha o ID
      // para a página canônica, que depois restaura a URL bonita via
      // history.replaceState em velarion-profile-page.js.
      var target = base + "users/profile.html?id=" + encodeURIComponent(id);
      location.replace(target);
    })();
  </script>

  <style>
    html,body{margin:0;min-height:100%;background:#070a18;color:#eef3ff;font-family:Arial,sans-serif}
    html[data-vl404="true"] body{display:grid;place-items:center;padding:24px;box-sizing:border-box}
    html[data-vl404="true"] main{width:min(560px,100%);padding:32px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#0d1226;text-align:center;box-sizing:border-box}
    html[data-vl404="true"] a{color:#79dfff}
  </style>
</head>
<body>
  <main id="vl404Fallback">
    <h1>Página não encontrada</h1>
    <p>O caminho solicitado não existe no Velarion Lumen.</p>
    <a id="vl404Home" href="./index.html">Voltar ao Hub</a>
  </main>

  <script>
    (function(){
      if (document.documentElement.dataset.vl404 !== "true") return;
      var path = location.pathname || "/";
      var link = document.getElementById("vl404Home");
      if (!link) return;
      var marker = path.indexOf("/users/");
      var base = marker >= 0 ? path.slice(0, marker + 1) : path.replace(/[^/]*$/, "");
      link.href = base + "index.html";
    })();
  </script>
</body>
</html>
